# Builds the site on every push and pull request (a passing build means `astro check` passed too)
# and deploys pushes to the `webpage` branch to GitHub Pages.
# Repository setting required: Settings → Pages → Source = "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [webpage]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for more.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes an older build of the same ref,
# but a pull request never cancels a production deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
